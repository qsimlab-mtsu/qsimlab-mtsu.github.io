<rect width="1600" height="560" fill="url(#bg)"/>
<g fill="#fff">
<circle cx="120" cy="40" r="1.2" opacity=".7"/><circle cx="410" cy="500" r="1" opacity=".5"/><circle cx="700" cy="60" r="1.4" opacity=".8"/><circle cx="880" cy="470" r="1" opacity=".6"/><circle cx="960" cy="120" r="1.6" opacity=".8"/><circle cx="1100" cy="520" r="1.2" opacity=".7"/><circle cx="1450" cy="60" r="1.4" opacity=".8"/><circle cx="1540" cy="300" r="1" opacity=".6"/><circle cx="1010" cy="330" r="1" opacity=".5"/><circle cx="1210" cy="40" r="1" opacity=".6"/><circle cx="1500" cy="500" r="1.2" opacity=".7"/>
</g>
