<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="bg" cx="78%" cy="45%" r="85%"><stop offset="0" stop-color="#34208a"/><stop offset=".5" stop-color="#121848"/><stop offset="1" stop-color="#070a20"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#9fbcff" stop-opacity=".95"/><stop offset="1" stop-color="#9fbcff" stop-opacity="0"/></radialGradient>
<radialGradient id="hot"><stop offset="0" stop-color="#ffb46b"/><stop offset="1" stop-color="#ffb46b" stop-opacity="0"/></radialGradient>
<radialGradient id="sph" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#8fb0ff" stop-opacity=".55"/><stop offset=".6" stop-color="#4b3fc8" stop-opacity=".22"/><stop offset="1" stop-color="#1a1460" stop-opacity=".1"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#6f93ff"/><stop offset="1" stop-color="#c39bff"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1600" height="560" fill="url(#fade)"/></mask>
