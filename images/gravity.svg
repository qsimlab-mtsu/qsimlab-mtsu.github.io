<rect width="800" height="450" fill="url(#bg)"/>
<g fill="#fff"><circle cx="60" cy="50" r="1.3" opacity=".8"/><circle cx="330" cy="30" r="1" opacity=".6"/><circle cx="470" cy="400" r="1.4" opacity=".8"/><circle cx="120" cy="410" r="1" opacity=".6"/><circle cx="740" cy="60" r="1.4" opacity=".8"/><circle cx="700" cy="410" r="1" opacity=".6"/><circle cx="410" cy="120" r="1" opacity=".5"/><circle cx="30" cy="250" r="1.2" opacity=".7"/></g>
